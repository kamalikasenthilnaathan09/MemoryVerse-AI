<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MemoryVerse AI - Register</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<div class="login-box">


<h1>
🧠 Create Account
</h1>


<p>
Build your intelligent digital identity
</p>



<form method="POST">


<input 
type="text"
name="name"
placeholder="Full Name"
required>


<input
type="email"
name="email"
placeholder="Email"
required>


<input
type="password"
name="password"
placeholder="Password"
required>


<button type="submit">
Register
</button>


</form>


<p>
Already have an account?

<a href="/login">
Login
</a>

</p>


</div>


</body>

</html>
